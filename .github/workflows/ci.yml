name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  dell-core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dell-node/core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: dell-node/core/requirements.txt
      - run: pip install -r requirements.txt
      - name: Run Core tests
        run: python -m unittest discover -p 'test_*.py' -v
      - name: Check Phase 3-13 smoke/deploy syntax
        run: |
          bash -n ../scripts/phase3-smoke.sh
          python -m py_compile ../scripts/google-oauth-bootstrap.py
          bash -n ../scripts/google-live-smoke.sh
          for f in ../scripts/phase4-*.sh ../scripts/phase5-*.sh; do bash -n "$f"; done
          bash -n ../scripts/phase6-daily-utility-smoke.sh
          bash -n ../scripts/phase7-personal-agent-smoke.sh
          bash -n ../scripts/phase8-secure-authenticated-web-smoke.sh
          bash -n ../scripts/deploy-phase8.sh
          python -m py_compile ../scripts/phase8-browser-profile-bootstrap.py
          bash -n ../scripts/phase9-deep-memory-smoke.sh
          bash -n ../scripts/deploy-phase9.sh
          bash -n ../scripts/phase10-proactive-intelligence-smoke.sh
          bash -n ../scripts/deploy-phase10.sh
          bash -n ../scripts/phase11-life-work-operations-smoke.sh
          bash -n ../scripts/deploy-phase11.sh
          bash -n ../scripts/phase12-autonomous-projects-smoke.sh
          bash -n ../scripts/deploy-phase12.sh
          bash -n ../scripts/phase13-specialist-orchestration-smoke.sh
          bash -n ../scripts/deploy-phase13.sh

  browser-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dell-node/browser-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: dell-node/browser-worker/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m py_compile app/policy.py app/main.py app/auth_profiles.py app/combined.py
      - run: python -m unittest test_policy.py test_auth_profiles.py -v
      - run: |
          grep -q '^playwright==1.63.0$' requirements.txt
          grep -q 'mcr.microsoft.com/playwright/python:v1.63.0-noble' Dockerfile
