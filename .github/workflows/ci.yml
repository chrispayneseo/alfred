name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  dell-core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dell-node/core
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: dell-node/core/requirements.txt
      - name: Install Core dependencies
        run: pip install -r requirements.txt
      - name: Run Core tests
        run: python -m unittest discover -p 'test_*.py' -v
      - name: Check Phase 3 smoke script syntax
        run: bash -n ../scripts/phase3-smoke.sh
      - name: Check Google bootstrap and live smoke syntax
        run: |
          python -m py_compile ../scripts/google-oauth-bootstrap.py
          bash -n ../scripts/google-live-smoke.sh
